# The marketing website: every page is a prerendered file (`/features` is `features.html`).
#
# A template: nginx fills in `${ANALYTICS_ORIGIN}` from the environment when the container
# starts (docker/Dockerfile.website sets the default and limits the substitution to it).
#
# Every header is set on the server, never in a location: an `add_header` in a location
# drops the server's, and the security headers must reach every answer.
map $uri $website_cache_control {
  # Hashed asset filenames are immutable.
  ~^/assets/ "public, max-age=31536000, immutable";
  # The icons, the share card and the manifest change only with a deploy.
  ~^/(favicon\.svg|apple-touch-icon\.png|share\.png|site\.webmanifest)$ "public, max-age=86400";
  # Crawler files: fresh enough without hitting the origin on every crawl.
  ~^/(robots\.txt|sitemap\.xml)$ "public, max-age=3600";
  # HTML and /theme.js are revalidated on every load, or a deploy leaves clients pinned to
  # stale pages.
  default "no-cache";
}

server {
  listen 80;
  server_name _;
  server_tokens off;
  root /usr/share/nginx/html;

  # The only third-party script is the analytics (Plausible, self hosted, at
  # ANALYTICS_ORIGIN; `analytics` in src/site.ts, the same variable at build time), loaded
  # after a visitor accepts; it posts its events to its own origin.
  # Everything else is the site's own: the theme script is /theme.js, the fonts are
  # bundled. Styles allow 'unsafe-inline' for the style attributes Vue renders.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' ${ANALYTICS_ORIGIN}; connect-src 'self' ${ANALYTICS_ORIGIN}; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
  add_header Cache-Control $website_cache_control;

  location /assets/ {
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri.html $uri/ =404;
  }

  error_page 404 /404.html;
  location = /404.html {
    internal;
  }

  gzip on;
  gzip_types text/css application/javascript application/json application/xml image/svg+xml text/plain application/manifest+json;
  gzip_min_length 1024;
}
