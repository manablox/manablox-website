<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The first match wins, so the unconditional one is last: it is the fallback for
         anything that ignores the media queries, chat apps colouring a card included. -->
    <meta name="theme-color" content="#f9fafb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#090a0d" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f9fafb" />
    <meta name="color-scheme" content="light dark" />
    <!-- The display face sets the hero; fetch it before the stylesheet asks. -->
    <link
      rel="preload"
      href="./node_modules/@fontsource-variable/bricolage-grotesque/files/bricolage-grotesque-latin-standard-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="Manablox" />
    <meta name="application-name" content="Manablox" />
    <!-- Before the first paint, so blocking on purpose: a file rather than inline, so the
         Content-Security-Policy needs no exception for inline scripts. -->
    <script src="/theme.js"></script>
    <!--app-head-->
  </head>
  <body>
    <div id="app"><!--app-html--></div>
    <script type="module" src="/src/entry-client.ts"></script>
  </body>
</html>
